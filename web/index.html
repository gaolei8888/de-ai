<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>点睛 de-ai — Inspector MVP</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;color:#1b2631;background:#f6f8fa}
*{box-sizing:border-box}body{margin:0}.shell{max-width:1150px;margin:42px auto;padding:0 24px}header{display:flex;align-items:baseline;gap:18px;margin-bottom:28px}h1{font-size:32px;margin:0}h2{font-size:18px}small,.sub{color:#64748b}main{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{background:white;border:1px solid #e2e8f0;border-radius:15px;padding:22px;min-width:0}
textarea{width:100%;height:390px;resize:vertical;font:14px/1.6 ui-monospace,SFMono-Regular,monospace;border:1px solid #cbd5e1;border-radius:10px;padding:15px;background:#fafbfc}
.controls{display:flex;gap:12px;align-items:center;margin-bottom:16px}select,button{padding:10px 15px;border-radius:9px;border:1px solid #cbd5e1;background:white}button{background:#163b67;color:white;border-color:#163b67;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
.issue{border-left:3px solid #e0a450;background:#fbfcfd;border-radius:5px;padding:12px;margin:12px 0}.issue.major{border-left-color:#d66c6c}.issue strong{display:block}.issue code{display:block;white-space:pre-wrap;overflow-wrap:anywhere;margin:7px 0}.status{font-size:13px;color:#64748b}#results{max-height:530px;overflow:auto}#results p{line-height:1.5}
@media(max-width:760px){main{grid-template-columns:1fr}.shell{margin-top:24px;padding:0 12px}textarea{height:290px}}
</style></head>
<body><div class="shell"><header><h1>点睛 <small>de-ai Studio</small></h1><span class="sub">AI 作品智能精修 · 质量审查 MVP</span></header>
<main><section class="panel"><h2>Source</h2><div class="controls"><label for="modality">Mode</label><select id="modality"><option value="text">Text</option><option value="ui">Software UI (HTML)</option></select><button id="run">Inspect</button></div>
<label for="content" class="sub">Paste text or HTML source. Analysis is rule-based; no content is stored by this app.</label>
<textarea id="content" spellcheck="false">AI 不仅改变我们的生活，更是颠覆性的技术，未来已来。</textarea>
<p class="status">Audio and video are planned, not implemented in this MVP.</p></section>
<section class="panel"><h2>Findings</h2><p id="status" class="status" role="status" aria-live="polite">Press Inspect to run checks.</p><div id="results"></div></section></main></div>
<script>
const run=document.getElementById('run'),status=document.getElementById('status'),results=document.getElementById('results');
const el=(name,text,parent,cls)=>{const n=document.createElement(name);n.textContent=text;if(cls)n.className=cls;parent.appendChild(n);return n};
run.addEventListener('click',async()=>{run.disabled=true;results.replaceChildren();status.textContent='Inspecting…';
try{const response=await fetch('/v1/inspect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({modality:document.getElementById('modality').value,content:document.getElementById('content').value})});
if(!response.ok){throw new Error('Request failed ('+response.status+'). Enter nonempty content under 200,000 characters.')}
const data=await response.json();status.textContent=data.issues.length+' issue(s) found. Heuristic results require human review.';
if(!data.issues.length)el('p','No matching rules triggered. This does not certify the content as high quality.',results);
data.issues.forEach(issue=>{const card=el('article','',results,'issue '+issue.severity);el('strong',issue.message,card);el('code',issue.evidence,card);el('p',issue.suggestion,card);el('small',issue.code+' · '+issue.severity,card)});
}catch(e){status.textContent=e.message}finally{run.disabled=false}});
</script></body></html>
